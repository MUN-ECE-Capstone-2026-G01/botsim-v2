# Fleet configuration — shared between host and robots.
# Deploy this file to ~/botsim/fleet.yaml on each Pi alongside robot/.

# broker_host: "192.168.x.x"   # set to host laptop IP before deploying
broker_host: "192.168.78.83"
broker_port: 8765
broker_timeout: 5              # seconds before robot stops if broker unreachable
trajectory_cleanup_delay: 10   # seconds after arrival before trail is cleared from UI map

color_palette:
  red:    "#e74c3c"
  blue:   "#3498db"
  green:  "#2ecc71"
  yellow: "#f1c40f"
  white:  "#aaaaaa"            # grey substitute (pure white invisible on light backgrounds)

# Paths on each Pi for lighthouse init (used by fleet_manager start)
venv_path:              "~/Desktop/lighthousedeck/venv"
reboot_script_path:     "~/Desktop/lighthousedeck/lighthouse-fpga/tools/reboot.py"
bootloader_script_path: "~/Desktop/lighthousedeck/lighthouse-bootloader/scripts/uart_bootloader.py"
lighthouse_bin_path:    "~/Desktop/lighthousedeck/lighthouse-fpga/lighthouse.bin"
lighthouse_uart:        "/dev/ttyAMA2"

robots:
  - id: civr-white
    host: civr-white.local
    user: visor
    invert_v: true             # negate forward velocity (depends on motor wiring)
    color: white
  - id: civr-blue
    host: civr-blue.local
    user: visor
    invert_v: true
    color: blue
